{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Регистрация — ТурбоСервер</title>

    <link rel="stylesheet" href="{% static 'hosting/css/base.css' %}">
</head>

<body>

<header class="header">
    <div class="container header-inner">
        <a href="{% url 'home' %}" class="logo">
            ТУРБОСЕРВЕР
        </a>
    </div>
</header>

<main class="auth-page">
    <div class="container">

        <div class="auth-card">

            <h1>Регистрация</h1>

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit">
                    Зарегистрироваться
                </button>
            </form>

            <p>
                Уже есть аккаунт?

                <a href="{% url 'login' %}">
                    Войти
                </a>
            </p>

        </div>

    </div>
</main>

</body>
</html>

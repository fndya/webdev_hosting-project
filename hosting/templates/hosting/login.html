{% load static %}
{% load hosting_tags %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вход — ТурбоСервер</title>

    <link rel="stylesheet" href="{% static 'hosting/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'hosting/css/auth.css' %}">
    <link rel="icon" href="{% static 'hosting/favicon.ico' %}" type="image/x-icon">
</head>

<body>

<header class="header">
    <div class="container header-inner">
        <a href="{% url 'home' %}" class="logo">
            ТУРБОСЕРВЕР
        </a>
    </div>
</header>

<main class="auth-page">
    <div class="container">

        <div class="auth-card">

            <h1>Вход</h1>

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit">
                    Войти
                </button>
            </form>

            <p>
                Нет аккаунта?

                <a href="{% url 'register' %}">
                    Зарегистрироваться
                </a>
            </p>

        </div>

    </div>
</main>
<footer class="footer">
    <div class="container">
        <strong>ТУРБОСЕРВЕР</strong>
        <span>© {% current_year %}</span>
    </div>
</footer>

</body>
</html>
